name: ytlecture2slide
services:
  backend:
    build: ./backend
    environment:
      APP_ENV: production
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      STORAGE_DIR: /data
      TEMP_DIR: /data/jobs
      DATABASE_PATH: /data/database/app.db
      CORS_ORIGINS: '[]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      DEFAULT_SEARCH_KEYWORD: ${DEFAULT_SEARCH_KEYWORD:-IDO}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DISCOVERY_LOOKBACK_DAYS: ${DISCOVERY_LOOKBACK_DAYS:-7}
      DISCOVERY_MIN_DURATION_SECONDS: ${DISCOVERY_MIN_DURATION_SECONDS:-1200}
      DISCOVERY_MAX_RESULTS_PER_CHANNEL: ${DISCOVERY_MAX_RESULTS_PER_CHANNEL:-50}
      DISCOVERY_QUOTA_LIMIT: ${DISCOVERY_QUOTA_LIMIT:-10000}
      DISCOVERY_SEARCH_QUOTA_LIMIT: ${DISCOVERY_SEARCH_QUOTA_LIMIT:-100}
      FRAME_DIR: ${FRAME_DIR:-/data/jobs/frames}
      EXTRACTION_INTERVAL_SECONDS: ${EXTRACTION_INTERVAL_SECONDS:-60}
      EXTRACTION_CONCURRENT_LIMIT: ${EXTRACTION_CONCURRENT_LIMIT:-1}
      EXTRACTION_RETRY_ATTEMPTS: ${EXTRACTION_RETRY_ATTEMPTS:-3}
      EXTRACTION_MIN_FREE_DISK_MB: ${EXTRACTION_MIN_FREE_DISK_MB:-500}
      EXTRACTION_MAX_FILTER_BYTES: ${EXTRACTION_MAX_FILTER_BYTES:-32000}
      EXTRACTION_MAX_FRAMES: ${EXTRACTION_MAX_FRAMES:-100000}
      EXTRACTION_STRATEGY: ${EXTRACTION_STRATEGY:-seek}
      EXTRACTION_THREADS: ${EXTRACTION_THREADS:-1}
      EXTRACTION_PROGRESS_INTERVAL_SECONDS: ${EXTRACTION_PROGRESS_INTERVAL_SECONDS:-2}
      SLIDE_PROCESSING: '${SLIDE_PROCESSING:-{}}'
      SLIDE_CHANNEL_PROFILES: '${SLIDE_CHANNEL_PROFILES:-{}}'
      SLIDE_CONCURRENT_LIMIT: ${SLIDE_CONCURRENT_LIMIT:-1}
      SLIDE_RETRY_ATTEMPTS: ${SLIDE_RETRY_ATTEMPTS:-3}
      CLEANUP_RETENTION_HOURS: ${CLEANUP_RETENTION_HOURS:-48}
      CLEANUP_DRY_RUN: ${CLEANUP_DRY_RUN:-false}
      DOWNLOAD_JS_RUNTIME: ${DOWNLOAD_JS_RUNTIME:-deno}
      DOWNLOAD_JS_RUNTIME_PATH: ${DOWNLOAD_JS_RUNTIME_PATH:-/usr/local/bin/deno}
      DOWNLOAD_MAX_RESOLUTION: ${DOWNLOAD_MAX_RESOLUTION:-720}
      DOWNLOAD_AUDIO_ENABLED: ${DOWNLOAD_AUDIO_ENABLED:-false}
      DOWNLOAD_CONCURRENT_LIMIT: ${DOWNLOAD_CONCURRENT_LIMIT:-1}
      DOWNLOAD_RETRY_ATTEMPTS: ${DOWNLOAD_RETRY_ATTEMPTS:-3}
      DOWNLOAD_CONNECT_TIMEOUT_SECONDS: ${DOWNLOAD_CONNECT_TIMEOUT_SECONDS:-30}
      DOWNLOAD_INACTIVITY_TIMEOUT_SECONDS: ${DOWNLOAD_INACTIVITY_TIMEOUT_SECONDS:-120}
      DOWNLOAD_MAX_TOTAL_TIMEOUT_SECONDS: ${DOWNLOAD_MAX_TOTAL_TIMEOUT_SECONDS:-}
      DOWNLOAD_MIN_FREE_DISK_MB: ${DOWNLOAD_MIN_FREE_DISK_MB:-500}
    volumes:
      - application-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  application-data:
