[project]
name = "ytlecture2slide"
version = "0.1.0"
description = "Local lecture-to-slide application foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "tzdata>=2025.1",
  "python-multipart>=0.0.34",
  "httpx>=0.27,<1",
  "isodate>=0.6,<1",
  "yt-dlp>=2026.11.23",
  "yt-dlp-ejs==0.8.0",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2,<3",
  "scikit-image>=0.24,<1",
  "pymupdf>=1.25,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "httpx2>=2.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app", "migrations", "tests", "scripts"]
untyped_calls_exclude = ["pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
